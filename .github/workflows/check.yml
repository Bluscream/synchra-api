name: Check

# Disabled: workflows do not run under this account; uncomment if you fork this repository.
#
#  push:
#    branches: [main]
#  pull_request:

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Shell
        run: shellcheck tools/*.sh

      - name: The spec parses, and is normalised
        run: |
          jq empty spec/openapi.json
          # fetch-spec.sh writes with --sort-keys; if the committed file is not in that form, the
          # next refresh produces a diff of the whole document and hides the real change.
          diff <(jq --sort-keys . spec/openapi.json) spec/openapi.json \
            || { echo '::error::spec/openapi.json is not key-sorted — re-run tools/fetch-spec.sh'; exit 1; }

      # Applying the overlay is itself the drift check: a note whose target the description no longer
      # has, or an addition it now defines itself, fails here and names what moved. --check then
      # confirms the committed annotated spec and rendered notes match what this would write.
      - name: Annotations
        run: python3 tools/annotate-spec.py --check --docs docs/ANNOTATIONS.md

      # Both documents, because the overlay adds paths, schemas, responses and security schemes — any
      # of which could make a valid document invalid.
      - name: Specs are valid OpenAPI
        run: |
          pip install --quiet openapi-spec-validator
          python3 - <<'PY'
          import json
          from openapi_spec_validator import validate
          for f in ('spec/openapi.json', 'spec/openapi.annotated.json'):
              validate(json.load(open(f)))
              print('valid:', f)
          PY

      - name: Gift tables
        run: |
          python3 tools/check_gifts.py data/tiktok_gifts.json
          python3 tools/check_gifts.py data/tiktok_gifts_coinvertify.json

      - name: Tools compile
        run: python3 -m compileall -q tools/
